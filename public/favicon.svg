<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#1A7FE8"/>
      <stop offset="100%" stop-color="#3DEDC4"/>
    </linearGradient>
  </defs>

  <!-- Dark rounded background -->
  <rect width="64" height="64" rx="13" fill="#111111"/>

  <!-- "CG" text — Oxanium-style bold, filled with gradient -->
  <text
    x="50%"
    y="50%"
    text-anchor="middle"
    dominant-baseline="central"
    font-family="'Oxanium', 'Arial Rounded MT Bold', 'Helvetica Neue', Arial, sans-serif"
    font-weight="800"
    font-size="28"
    letter-spacing="-1"
    fill="url(#grad)"
  >CG</text>
</svg>
